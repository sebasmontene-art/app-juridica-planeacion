<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planning Dashboard Juridico</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <button id="menuToggle" class="menu-toggle" type="button" title="Mostrar u ocultar menu">☰</button>
        <strong>App juridica</strong>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1>Planeacion de plataforma juridica modular</h1>
          <p id="saveState">Cargando datos locales...</p>
        </div>
        <div class="actions">
          <input id="search" type="search" placeholder="Buscar en el plan">
          <label class="autosave-toggle" title="Guarda automaticamente unos segundos despues de editar">
            <input id="autoSaveToggle" type="checkbox">
            <span>Autoguardar</span>
          </label>
          <button id="saveBtn" type="button">Guardar cambios</button>
          <button id="exportBtn" type="button">Exportar resumen</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
